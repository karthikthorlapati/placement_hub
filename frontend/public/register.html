<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Placement Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav>
    <h1>🎓 Placement Hub</h1>
    <a href="index.html">Home</a>
  </nav>

  <!-- Register Form -->
  <div class="auth-container">
    <div class="auth-box">
      <h2>Create Account</h2>
      <p>Register to get started</p>

      <!-- Error Message -->
      <div id="errorMsg" class="error-msg" style="display:none"></div>

      <!-- Success Message -->
      <div id="successMsg" class="success-msg" style="display:none"></div>

      <form id="registerForm">
  
  <div class="form-group">
    <label>Full Name *</label>
    <input type="text" id="name" required />
  </div>

  <div class="form-group">
    <label>Email *</label>
    <input type="email" id="email" required />
  </div>

  <div class="form-group">
    <label>Password *</label>
    <input type="password" id="password" required minlength="6" />
  </div>

  <div class="form-group">
    <label>Role *</label>
    <select id="role" required>
      <option value="">Select Role</option>
      <option value="student">Student</option>
      <option value="coordinator">Placement Coordinator</option>
      <option value="head">Placement Head</option>
    </select>
  </div>

  <div class="form-group" id="departmentField" style="display:none;">
    <label>Department *</label>
    <input type="text" id="department" required placeholder="e.g. CSE, ECE, AIML" />
  </div>

  <div class="form-group" id="rollField" style="display:none;">
    <label>Roll Number *</label>
    <input type="text" id="rollNumber" required placeholder="e.g. 21CSE001" />
  </div>

  <div class="form-group" id="phoneField" style="display:none;">
    <label>Phone Number *</label>
    <input type="tel" id="phone" required pattern="[0-9]{10}" 
           maxlength="10" placeholder="10 digit number" />
  </div>

  <div class="form-group" id="cgpaField" style="display:none;">
    <label>CGPA *</label>
    <input type="number" id="cgpa" required min="0" max="10" step="0.01" />
  </div>

  <button type="submit">Register</button>
</form>

      <p class="bottom-text">
        Already have an account?
        <a href="login.html">Login here</a>
      </p>

    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/register.js"></script>

</body>
</html>
