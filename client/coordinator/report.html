<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Report - Placement Hub</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav>
    <h1>🎓 Placement Hub</h1>
    <div class="nav-right">
      <span id="coordinatorName">Welcome!</span>
      <a href="../login.html" onclick="logout()" class="btn-logout">Logout</a>
    </div>
  </nav>

  <!-- Dashboard Content -->
  <div class="dashboard-container">

    <!-- Sidebar -->
    <div class="sidebar">
      <ul>
        <li><a href="dashboard.html">🏠 Dashboard</a></li>
        <li><a href="students.html">👨‍🎓 Students</a></li>
        <li><a href="companies.html">🏢 Companies</a></li>
        <li><a href="report.html" class="active">📊 Reports</a></li>
      </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <h2>📊 Company Report</h2>

      <!-- Select Company -->
      <div class="section">
        <h3>Select Company</h3>
        <div class="form-group">
          <select id="companySelect" onchange="loadReport()">
            <option value="">-- Select a Company --</option>
          </select>
        </div>
      </div>

      <!-- Report Stats -->
      <div id="reportStats" style="display:none">
        <div class="stats-container">
          <div class="stat-card blue">
            <h3 id="totalStudents">0</h3>
            <p>Total Students</p>
          </div>
          <div class="stat-card green">
            <h3 id="totalApplied">0</h3>
            <p>Applied</p>
          </div>
          <div class="stat-card orange">
            <h3 id="totalNotApplied">0</h3>
            <p>Not Applied</p>
          </div>
        </div>
      </div>

      <!-- Applied Students -->
      <div id="appliedSection" style="display:none">
        <div class="section">
          <h3>✅ Students Who Applied</h3>
          <div id="appliedList"></div>
        </div>
      </div>

      <!-- Not Applied Students -->
      <div id="notAppliedSection" style="display:none">
        <div class="section">
          <h3>❌ Students Who Did Not Apply</h3>
          <div id="notAppliedList"></div>
        </div>
      </div>

    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/coordinator-report.js"></script>

</body>
</html>
