<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Companies - Placement Hub</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav>
    <h1>🎓 Placement Hub</h1>
    <div class="nav-right">
      <span id="coordinatorName">Welcome!</span>
      <a href="../login.html" onclick="logout()" class="btn-logout">Logout</a>
    </div>
  </nav>

  <!-- Dashboard Content -->
  <div class="dashboard-container">

    <!-- Sidebar -->
    <div class="sidebar">
      <ul>
        <li><a href="dashboard.html">🏠 Dashboard</a></li>
        <li><a href="students.html">👨‍🎓 Students</a></li>
        <li><a href="companies.html" class="active">🏢 Companies</a></li>
      </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <h2>Manage Companies</h2>

      <!-- Add Company Form -->
      <div class="section">
        <h3>➕ Add New Company</h3>

        <div id="formError" class="error-msg" style="display:none"></div>
        <div id="formSuccess" class="success-msg" style="display:none"></div>

        <div class="add-company-form">

          <div class="form-row">
            <div class="form-group">
              <label>Company Name</label>
              <input type="text" id="companyName" placeholder="e.g. TCS" />
            </div>
            <div class="form-group">
              <label>Job Role</label>
              <input type="text" id="companyRole" placeholder="e.g. Software Engineer" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Package</label>
              <input type="text" id="companyPackage" placeholder="e.g. 7 LPA" />
            </div>
            <div class="form-group">
              <label>Last Date</label>
              <input type="date" id="companyLastDate" />
            </div>
          </div>

          <div class="form-group">
            <label>Eligibility</label>
            <input type="text" id="companyEligibility" placeholder="e.g. Above 7 CGPA" />
          </div>

          <div class="form-group">
            <label>Description</label>
            <textarea id="companyDescription" placeholder="Brief description about company"></textarea>
          </div>

          <button class="btn-full" onclick="addCompany()">Add Company</button>

        </div>
      </div>

      <!-- Companies List -->
      <div class="section">
        <h3>📋 All Companies</h3>
        <div id="companiesList">
          <p>Loading companies...</p>
        </div>
      </div>

    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/coordinator-companies.js"></script>

</body>
</html>
