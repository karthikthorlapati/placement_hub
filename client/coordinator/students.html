<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students - Placement Hub</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav>
    <h1>🎓 Placement Hub</h1>
    <div class="nav-right">
      <span id="coordinatorName">Welcome!</span>
      <a href="../login.html" onclick="logout()" class="btn-logout">Logout</a>
    </div>
  </nav>

  <!-- Dashboard Content -->
  <div class="dashboard-container">

    <!-- Sidebar -->
    <div class="sidebar">
      <ul>
        <li><a href="dashboard.html">🏠 Dashboard</a></li>
        <li><a href="students.html" class="active">👨‍🎓 Students</a></li>
        <li><a href="companies.html">🏢 Companies</a></li>
        <li><a href="report.html">📊 Reports</a></li>
      </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <h2>All Students</h2>

      <!-- Search Bar -->
      <div class="search-bar">
        <input
          type="text"
          id="searchInput"
          placeholder="Search students..."
          onkeyup="searchStudents()"
        />
      </div>

      <!-- Students List -->
      <div id="studentsList">
        <p>Loading students...</p>
      </div>

    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/coordinator-students.js"></script>

</body>
</html>
