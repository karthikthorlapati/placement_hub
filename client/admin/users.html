<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users - Placement Hub</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav>
    <h1>🎓 Placement Hub</h1>
    <div class="nav-right">
      <span id="adminName">Welcome!</span>
      <a href="../login.html" onclick="logout()" class="btn-logout">Logout</a>
    </div>
  </nav>

  <!-- Dashboard Content -->
  <div class="dashboard-container">

    <!-- Sidebar -->
    <div class="sidebar">
      <ul>
        <li><a href="dashboard.html">🏠 Dashboard</a></li>
        <li><a href="users.html" class="active">👥 All Users</a></li>
        <li><a href="companies.html">🏢 All Companies</a></li>
        <li><a href="applications.html">📋 All Applications</a></li>
      </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <h2>All Users</h2>

      <!-- Filter Buttons -->
      <div class="filter-buttons">
        <button class="filter-btn active" onclick="filterUsers('all')">
          All
        </button>
        <button class="filter-btn" onclick="filterUsers('student')">
          Students
        </button>
        <button class="filter-btn" onclick="filterUsers('coordinator')">
          Coordinators
        </button>
      </div>

      <!-- Users List -->
      <div id="usersList">
        <p>Loading users...</p>
      </div>

    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/admin-users.js"></script>

</body>
</html>
