<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Placement Hub</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav>
    <h1>🎓 Placement Hub</h1>
    <div class="nav-right">
      <span id="studentName">Welcome!</span>
      <a href="../login.html" onclick="logout()" class="btn-logout">Logout</a>
    </div>
  </nav>

  <!-- Dashboard Content -->
  <div class="dashboard-container">

    <!-- Sidebar -->
    <div class="sidebar">
      <ul>
        <li><a href="dashboard.html">🏠 Dashboard</a></li>
        <li><a href="companies.html">🏢 Companies</a></li>
        <li><a href="applications.html">📋 My Applications</a></li>
        <li><a href="notifications.html">🔔 Notifications</a></li>
        <li><a href="profile.html" class="active">👤 Profile</a></li>
      </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <h2>👤 My Profile</h2>

      <!-- Success/Error Messages -->
      <div id="profileSuccess" class="success-msg" style="display:none"></div>
      <div id="profileError" class="error-msg" style="display:none"></div>

      <!-- Profile Form -->
      <div class="section">
        <h3>Update Profile</h3>
        <div class="profile-form">

          <div class="form-row">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" id="name" placeholder="Your full name" />
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="email" disabled />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Department</label>
              <input type="text" id="department" placeholder="Your department" />
            </div>
            <div class="form-group">
              <label>Roll Number</label>
              <input type="text" id="rollNumber" placeholder="Your roll number" />
            </div>
          </div>

          <div class="form-group">
            <label>Phone Number</label>
            <input type="text" id="phone" placeholder="Your phone number" />
          </div>

          <div class="form-group">
            <label>CGPA</label>
            <input
              type="number"
              id="cgpa"
              placeholder="Enter your CGPA (e.g. 8.5)"
              min="0"
              max="10"
              step="0.1"
            />
          </div>

          <button class="btn-full" onclick="updateProfile()">
            Update Profile
          </button>

        </div>
      </div>

      <!-- Change Password -->
      <div class="section">
        <h3>🔒 Change Password</h3>

        <div id="passwordSuccess" class="success-msg" style="display:none"></div>
        <div id="passwordError" class="error-msg" style="display:none"></div>

        <div class="profile-form">

          <div class="form-group">
            <label>Old Password</label>
            <input
              type="password"
              id="oldPassword"
              placeholder="Enter old password"
            />
          </div>

          <div class="form-group">
            <label>New Password</label>
            <input
              type="password"
              id="newPassword"
              placeholder="Enter new password"
            />
          </div>

          <div class="form-group">
            <label>Confirm New Password</label>
            <input
              type="password"
              id="confirmPassword"
              placeholder="Confirm new password"
            />
          </div>

          <button class="btn-full" onclick="changePassword()">
            Change Password
          </button>

        </div>
      </div>

    </div>
  </div>
  <script src="../js/main.js"></script>
  <script src="../js/profile.js"></script>

</body>
</html>
