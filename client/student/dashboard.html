<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard - Placement Hub</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav>
    <h1>🎓 Placement Hub</h1>
    <div class="nav-right">
      <span id="studentName">Welcome!</span>
      <a href="../login.html" onclick="logout()" class="btn-logout">Logout</a>
    </div>
  </nav>

  <!-- Dashboard Content -->
  <div class="dashboard-container">

    <!-- Sidebar -->
    <div class="sidebar">
      <ul>
        <li><a href="dashboard.html" class="active">🏠 Dashboard</a></li>
        <li><a href="companies.html">🏢 Companies</a></li>
        <li><a href="applications.html">📋 My Applications</a></li>
      </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <h2>Student Dashboard</h2>

      <!-- Stats Cards -->
      <div class="stats-container">
        <div class="stat-card blue">
          <h3 id="totalCompanies">0</h3>
          <p>Available Companies</p>
        </div>
        <div class="stat-card green">
          <h3 id="totalApplied">0</h3>
          <p>Applied Companies</p>
        </div>
        <div class="stat-card orange">
          <h3 id="totalShortlisted">0</h3>
          <p>Shortlisted</p>
        </div>
      </div>

      <!-- Recent Companies -->
      <div class="section">
        <h3>Recent Companies</h3>
        <div id="companiesList">
          <p>Loading companies...</p>
        </div>
      </div>

    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/student-dashboard.js"></script>

</body>
</html>
