<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Placement Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav>
    <h1>🎓 Placement Hub</h1>
    <a href="index.html">Home</a>
  </nav>

  <!-- Register Form -->
  <div class="auth-container">
    <div class="auth-box">
      <h2>Create Account</h2>
      <p>Register to get started</p>

      <!-- Error Message -->
      <div id="errorMsg" class="error-msg" style="display:none"></div>

      <!-- Success Message -->
      <div id="successMsg" class="success-msg" style="display:none"></div>

      <form id="registerForm">

        <div class="form-group">
          <label>Full Name</label>
          <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required
          />
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          />
        </div>

        <div class="form-group">
          <label>Role</label>
          <select id="role" required>
            <option value="">Select Role</option>
            <option value="student">Student</option>
            <option value="coordinator">Placement Coordinator</option>
          </select>
        </div>

        <!-- Only shown for Student and Coordinator -->
        <div class="form-group" id="departmentField" style="display:none">
          <label>Department</label>
          <input
            type="text"
            id="department"
            placeholder="Enter your department (e.g. CSE)"
          />
        </div>

        <!-- Only shown for Student -->
        <div class="form-group" id="rollField" style="display:none">
          <label>Roll Number</label>
          <input
            type="text"
            id="rollNumber"
            placeholder="Enter your roll number"
          />
        </div>

        <!-- Only shown for Student -->
        <div class="form-group" id="phoneField" style="display:none">
          <label>Phone Number</label>
          <input
            type="text"
            id="phone"
            placeholder="Enter your phone number"
          />
        </div>

        <button type="submit" class="btn-full">Register</button>

      </form>

      <p class="bottom-text">
        Already have an account?
        <a href="login.html">Login here</a>
      </p>

    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/register.js"></script>

</body>
</html>
